<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scanner - T-Scanner</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#111;--panel:#1b1b1d;--line:#2e2e32;--text:#f2f2f2;--mute:#9a9aa2;--accent:#ff9500}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;position:fixed;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer}

.nav{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.5px}
.brand img{height:24px}
.nav a.home{color:#fff;text-decoration:none;font-size:14px}

#cam{background:#000}
#video{width:100%;height:100%;object-fit:cover;display:block}
.bar{position:absolute;left:0;right:0;bottom:0;padding:18px 24px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.round{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;position:relative}
.shutter{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:none;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}
.shutter:active span{transform:scale(.9)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:8px;font-size:13px;display:none;z-index:6;text-align:center;max-width:90%}

/* crop */
#crop{background:#0b0b0c;z-index:20}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.hdr h3{font-size:16px;font-weight:600}
.tbtn{background:none;border:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 4px}
.tbtn.pri{color:var(--accent)}
#cropWrap{position:absolute;top:calc(56px + env(safe-area-inset-top));bottom:90px;left:0;right:0;display:flex;align-items:center;justify-content:center}
#cropCv{touch-action:none;display:block}
.cropbar{position:absolute;bottom:0;left:0;right:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:var(--panel);border-top:1px solid var(--line)}
.chip{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#222226;color:var(--text);font-size:13px;font-weight:600}
.chip.on{border-color:var(--accent);color:var(--accent)}
.hint{position:absolute;bottom:96px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}

/* review */
#rev{background:var(--bg);z-index:10}
#thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px}
.th{flex:0 0 58px;height:78px;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative;background:#222}
.th.on{border-color:var(--accent)}
.th img{width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:10px;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:3px}
#prevBox{position:absolute;top:calc(56px + env(safe-area-inset-top) + 92px);bottom:250px;left:16px;right:16px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
#prevBox img{max-width:100%;max-height:100%;object-fit:contain}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row .chip{flex:1;min-width:70px;text-align:center;padding:9px 6px;font-size:12px}
.opts{display:flex;gap:10px;margin-bottom:10px}
.opts input,.opts select{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#101012;color:var(--text);font-size:16px;font-family:inherit}
.make{width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#000;font-weight:700;font-size:15px}
.make:disabled{opacity:.5}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2a2a2e;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- CAMERA -->
<div class="screen on" id="cam">
  <div class="nav">
    <a class="brand" href="index.html"><img src="logo.png" alt="" onerror="this.style.display='none'">T-Scanner</a>
    <a class="home" href="index.html"><i class="fas fa-house"></i> Home</a>
  </div>
  <video id="video" autoplay muted playsinline></video>
  <div id="msg"></div>
  <div class="bar">
    <button class="round" id="galleryBtn" title="Choose photos"><i class="fas fa-image"></i></button>
    <button class="shutter" id="shutBtn" disabled><span></span></button>
    <button class="round" id="pagesBtn" title="Review pages"><i class="fas fa-layer-group"></i><span class="badge" id="badge" style="display:none">0</span></button>
  </div>
</div>

<!-- CROP -->
<div class="screen" id="crop">
  <div class="hdr">
    <button class="tbtn" id="cropCancel">Cancel</button>
    <h3>Adjust edges</h3>
    <button class="tbtn pri" id="cropDone">Done</button>
  </div>
  <div id="cropWrap"><canvas id="cropCv"></canvas></div>
  <div class="hint">Drag the corners so only the paper is inside</div>
  <div class="cropbar">
    <button class="chip" id="autoBtn">Auto detect</button>
    <button class="chip" id="fullBtn">Whole photo</button>
  </div>
</div>

<!-- REVIEW -->
<div class="screen" id="rev">
  <div class="hdr">
    <button class="tbtn" id="addMore"><i class="fas fa-camera"></i> Add page</button>
    <h3 id="revTitle">Pages</h3>
    <span style="width:80px"></span>
  </div>
  <div id="thumbs"></div>
  <div id="prevBox"><img id="prevImg" alt=""></div>
  <div class="panel">
    <div class="row" id="filters">
      <button class="chip" data-f="scan">Scan</button>
      <button class="chip" data-f="color">Color</button>
      <button class="chip" data-f="bw">Black &amp; white</button>
      <button class="chip" data-f="original">Original</button>
    </div>
    <div class="row">
      <button class="chip" id="recropBtn"><i class="fas fa-crop-simple"></i> Edges</button>
      <button class="chip" id="rotBtn"><i class="fas fa-rotate-right"></i> Rotate</button>
      <button class="chip" id="delBtn"><i class="fas fa-trash"></i> Delete</button>
    </div>
    <div class="opts">
      <input type="text" id="pdfName" value="twarvis_doc" aria-label="File name">
      <select id="quality" aria-label="Size">
        <option value="max">Smallest size</option>
        <option value="mid">Balanced</option>
        <option value="low">Best quality</option>
      </select>
    </div>
    <button class="make" id="makeBtn">Create PDF</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const WATERMARK = 'tscanner.cc.cd';
const LEVELS = { max:{side:1000,q:.4}, mid:{side:1400,q:.6}, low:{side:2000,q:.8} };

let stream = null, pages = [], cur = 0, lastFilter = 'scan';
let pending = null;            // {src, corners, editIndex}

function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2800); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }
function msg(t){ const m=$('msg'); if(!t){m.style.display='none';return;} m.textContent=t; m.style.display='block'; }
function updateBadge(){ const b=$('badge'); b.textContent=pages.length; b.style.display=pages.length?'flex':'none'; }

/* ---------- camera ---------- */
async function startCamera(){
  show('cam'); $('shutBtn').disabled = true; stopCamera();
  if(location.protocol!=='https:' && !['localhost','127.0.0.1'].includes(location.hostname)){ msg('Camera needs HTTPS.'); return; }
  try{
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}}}); }
    catch(e){ stream = await navigator.mediaDevices.getUserMedia({audio:false,video:true}); }
    $('video').srcObject = stream; await $('video').play();
    $('shutBtn').disabled = false; msg('');
  }catch(e){
    msg(e.name==='NotAllowedError' ? 'Please allow camera access.' : e.name==='NotFoundError' ? 'No camera found.' : 'Camera error: '+e.message);
  }
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

// takes exactly what is visible on the full screen
function capture(){
  const v=$('video'), vw=v.videoWidth, vh=v.videoHeight;
  if(!vw) return toast('Camera is not ready yet');
  const W=innerWidth, H=innerHeight, s=Math.max(W/vw,H/vh);
  const sw=W/s, sh=H/s, sx=(vw-sw)/2, sy=(vh-sh)/2;
  const k=Math.min(1,2200/Math.max(sw,sh));
  const c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  stopCamera(); openCrop(c, null, null);
}

/* ---------- crop editor ---------- */
const cv=$('cropCv'), cx=cv.getContext('2d');
let K=1, drag=-1;

function openCrop(src, corners, editIndex){
  pending={src, corners: corners || autoDetect(src), editIndex};
  show('crop');
  const aw=innerWidth-24, ah=innerHeight-190;
  K=Math.min(aw/src.width, ah/src.height);
  cv.width=Math.round(src.width*K); cv.height=Math.round(src.height*K);
  cv.style.width=cv.width+'px'; cv.style.height=cv.height+'px';
  drawCrop();
}
function drawCrop(){
  const {src,corners}=pending, p=corners.map(c=>({x:c.x*K,y:c.y*K}));
  cx.clearRect(0,0,cv.width,cv.height);
  cx.drawImage(src,0,0,cv.width,cv.height);
  cx.beginPath(); cx.rect(0,0,cv.width,cv.height);
  cx.moveTo(p[0].x,p[0].y); for(let i=1;i<4;i++) cx.lineTo(p[i].x,p[i].y); cx.closePath();
  cx.fillStyle='rgba(0,0,0,.55)'; cx.fill('evenodd');
  cx.beginPath(); cx.moveTo(p[0].x,p[0].y); for(let i=1;i<4;i++) cx.lineTo(p[i].x,p[i].y); cx.closePath();
  cx.strokeStyle='#ff9500'; cx.lineWidth=2; cx.stroke();
  p.forEach(q=>{ cx.beginPath(); cx.arc(q.x,q.y,13,0,7); cx.fillStyle='#fff'; cx.fill(); cx.lineWidth=3; cx.strokeStyle='#ff9500'; cx.stroke(); });
}
function pos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/K, y:(e.clientY-r.top)/K}; }
cv.addEventListener('pointerdown',e=>{
  const m=pos(e); let best=-1,bd=(48/K)**2;
  pending.corners.forEach((c,i)=>{ const d=(c.x-m.x)**2+(c.y-m.y)**2; if(d<bd){bd=d;best=i;} });
  drag=best; if(drag>=0) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(drag<0) return; const m=pos(e), s=pending.src;
  pending.corners[drag]={x:Math.max(0,Math.min(s.width,m.x)), y:Math.max(0,Math.min(s.height,m.y))};
  drawCrop();
});
cv.addEventListener('pointerup',()=>drag=-1);
cv.addEventListener('pointercancel',()=>drag=-1);

$('autoBtn').onclick=()=>{ pending.corners=autoDetect(pending.src); drawCrop(); };
$('fullBtn').onclick=()=>{ const s=pending.src; pending.corners=[{x:0,y:0},{x:s.width,y:0},{x:s.width,y:s.height},{x:0,y:s.height}]; drawCrop(); };
$('cropCancel').onclick=()=>{ if(pending.editIndex!==null) showReview(); else if(pages.length){ startCamera(); } else startCamera(); };
$('cropDone').onclick=()=>{
  const {src,corners,editIndex}=pending;
  if(editIndex!==null){ pages[editIndex].corners=corners; cur=editIndex; }
  else { pages.push({src,corners,filter:lastFilter,rot:0}); cur=pages.length-1; }
  updateBadge(); showReview();
};

// finds the bright paper area against a darker background
function autoDetect(src){
  const w=Math.min(240,src.width), h=Math.round(src.height*w/src.width);
  const t=document.createElement('canvas'); t.width=w; t.height=h;
  const x=t.getContext('2d'); x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data, g=new Uint8Array(w*h), hist=new Array(256).fill(0);
  for(let i=0;i<w*h;i++){ g[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])|0; hist[g[i]]++; }
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let wB=0,sB=0,mx=0,thr=128;
  for(let i=0;i<256;i++){ wB+=hist[i]; if(!wB) continue; const wF=w*h-wB; if(!wF) break; sB+=i*hist[i];
    const v=wB*wF*((sB/wB)-((sum-sB)/wF))**2; if(v>mx){mx=v;thr=i;} }
  const rows=new Array(h).fill(0), cols=new Array(w).fill(0);
  for(let j=0;j<h;j++) for(let i=0;i<w;i++) if(g[j*w+i]>thr){rows[j]++;cols[i]++;}
  const f=(a,n,r)=>{ let lo=0,hi=a.length-1; while(lo<hi&&a[lo]<n*r)lo++; while(hi>lo&&a[hi]<n*r)hi--; return [lo,hi]; };
  let [y0,y1]=f(rows,w,.3), [x0,x1]=f(cols,h,.3);
  if((x1-x0)*(y1-y0) < w*h*.25){ x0=w*.06; x1=w*.94; y0=h*.06; y1=h*.94; }
  const sx=src.width/w, sy=src.height/h, m=.005;
  const L=Math.max(0,x0*sx-src.width*m), R=Math.min(src.width,(x1+1)*sx+src.width*m);
  const T=Math.max(0,y0*sy-src.height*m), B=Math.min(src.height,(y1+1)*sy+src.height*m);
  return [{x:L,y:T},{x:R,y:T},{x:R,y:B},{x:L,y:B}];
}

/* ---------- rendering: perspective fix, scan filter, watermark ---------- */
function solve(A){
  const n=8;
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]];
    for(let r=i+1;r<n;r++){ const f=A[r][i]/A[i][i]; for(let c=i;c<=n;c++) A[r][c]-=f*A[i][c]; }
  }
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){ let s=A[i][n]; for(let c=i+1;c<n;c++) s-=A[i][c]*x[c]; x[i]=s/A[i][i]; }
  return x;
}
function warp(src, q, side){
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const W=(dist(q[0],q[1])+dist(q[3],q[2]))/2, H=(dist(q[0],q[3])+dist(q[1],q[2]))/2;
  const k=Math.min(1,side/Math.max(W,H));
  const w=Math.max(8,Math.round(W*k)), h=Math.max(8,Math.round(H*k));
  const dst=[[0,0],[w,0],[w,h],[0,h]], A=[];
  for(let i=0;i<4;i++){
    const [x,y]=dst[i], X=q[i].x, Y=q[i].y;
    A.push([x,y,1,0,0,0,-x*X,-y*X,X]); A.push([0,0,0,x,y,1,-x*Y,-y*Y,Y]);
  }
  const m=solve(A);
  const sw=src.width, sh=src.height;
  const sd=src.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const ox=out.getContext('2d'), od=ox.createImageData(w,h), o=od.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const z=m[6]*x+m[7]*y+1, u=(m[0]*x+m[1]*y+m[2])/z, v=(m[3]*x+m[4]*y+m[5])/z;
    const x0=Math.max(0,Math.min(sw-2,Math.floor(u))), y0=Math.max(0,Math.min(sh-2,Math.floor(v)));
    const fx=Math.max(0,Math.min(1,u-x0)), fy=Math.max(0,Math.min(1,v-y0));
    const i00=(y0*sw+x0)*4, i10=i00+4, i01=i00+sw*4, i11=i01+4, oi=(y*w+x)*4;
    for(let c=0;c<3;c++){
      o[oi+c]=(sd[i00+c]*(1-fx)+sd[i10+c]*fx)*(1-fy)+(sd[i01+c]*(1-fx)+sd[i11+c]*fx)*fy;
    }
    o[oi+3]=255;
  }
  ox.putImageData(od,0,0); return out;
}
function rotate(c,n){
  n=((n%4)+4)%4; if(!n) return c;
  const o=document.createElement('canvas'), sw=n%2;
  o.width=sw?c.height:c.width; o.height=sw?c.width:c.height;
  const x=o.getContext('2d'); x.translate(o.width/2,o.height/2); x.rotate(n*Math.PI/2); x.drawImage(c,-c.width/2,-c.height/2);
  return o;
}
function filter(c, mode){
  if(mode==='original') return c;
  const w=c.width,h=c.height, x=c.getContext('2d');
  const sm=document.createElement('canvas'); sm.width=Math.max(8,Math.round(w/24)); sm.height=Math.max(8,Math.round(h/24));
  const sx=sm.getContext('2d'); sx.imageSmoothingQuality='high'; sx.drawImage(c,0,0,sm.width,sm.height);
  const bgc=document.createElement('canvas'); bgc.width=w; bgc.height=h;
  const bx=bgc.getContext('2d'); bx.imageSmoothingQuality='high'; bx.drawImage(sm,0,0,w,h);
  const img=x.getImageData(0,0,w,h), d=img.data, b=bx.getImageData(0,0,w,h).data;
  const lv=n=>{ n=(n-105)/(232-105)*255; return n<0?0:n>255?255:n; };
  for(let i=0;i<d.length;i+=4){
    const bg=Math.max(40,0.299*b[i]+0.587*b[i+1]+0.114*b[i+2]);
    if(mode==='color'){ d[i]=lv(d[i]/bg*255); d[i+1]=lv(d[i+1]/bg*255); d[i+2]=lv(d[i+2]/bg*255); }
    else{
      const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let n=lv(g/bg*255); if(mode==='bw') n=n<150?0:255;
      d[i]=d[i+1]=d[i+2]=n;
    }
  }
  x.putImageData(img,0,0); return c;
}
function stamp(c){
  const x=c.getContext('2d'), s=Math.max(9,Math.round(c.width*.017)), m=Math.round(s*.9);
  x.font=`500 ${s}px Inter, Arial, sans-serif`; x.textAlign='right'; x.textBaseline='bottom';
  x.fillStyle='rgba(110,110,110,.75)'; x.fillText(WATERMARK,c.width-m,c.height-m*.8);
}
function render(p, side){
  let c=warp(p.src,p.corners,side);
  c=rotate(c,p.rot); c=filter(c,p.filter); stamp(c); return c;
}

/* ---------- review ---------- */
function showReview(){
  stopCamera(); show('rev');
  if(!pages.length){ startCamera(); return; }
  cur=Math.min(cur,pages.length-1);
  $('revTitle').textContent=`Page ${cur+1} of ${pages.length}`;
  const T=$('thumbs'); T.innerHTML='';
  pages.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='th'+(i===cur?' on':'');
    const im=new Image(); im.src=render(p,160).toDataURL('image/jpeg',.6);
    const n=document.createElement('i'); n.textContent=i+1;
    d.append(im,n); d.onclick=()=>{cur=i;showReview();}; T.appendChild(d);
  });
  $('prevImg').src=render(pages[cur],1300).toDataURL('image/jpeg',.8);
  document.querySelectorAll('#filters .chip').forEach(b=>b.classList.toggle('on',b.dataset.f===pages[cur].filter));
}
document.querySelectorAll('#filters .chip').forEach(b=>b.onclick=()=>{
  pages[cur].filter=b.dataset.f; lastFilter=b.dataset.f; showReview();
});
$('rotBtn').onclick=()=>{ pages[cur].rot=(pages[cur].rot+1)%4; showReview(); };
$('delBtn').onclick=()=>{ pages.splice(cur,1); updateBadge(); showReview(); };
$('recropBtn').onclick=()=>{ const p=pages[cur]; openCrop(p.src, p.corners.map(c=>({...c})), cur); };
$('addMore').onclick=startCamera;
$('pagesBtn').onclick=()=>{ if(!pages.length) return toast('No pages yet'); showReview(); };
$('shutBtn').onclick=capture;

$('galleryBtn').onclick=()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async()=>{
    const files=[...inp.files]; if(!files.length) return;
    stopCamera();
    for(const f of files){
      const img=await new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=URL.createObjectURL(f); });
      const k=Math.min(1,2200/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      pages.push({src:c,corners:autoDetect(c),filter:lastFilter,rot:0});
    }
    updateBadge(); cur=pages.length-files.length; openCrop(pages[cur].src, pages[cur].corners.map(c=>({...c})), cur);
    toast(files.length>1 ? 'Photos added. Check the edges on each page.' : 'Photo added');
  };
  inp.click();
};

/* ---------- PDF ---------- */
$('makeBtn').onclick=async()=>{
  if(!pages.length) return;
  if(!window.jspdf) return toast('PDF library did not load');
  const btn=$('makeBtn'); btn.disabled=true; btn.textContent='Working...';
  await new Promise(r=>setTimeout(r,30));
  try{
    const L=LEVELS[$('quality').value], { jsPDF }=window.jspdf;
    let pdf=null;
    for(let i=0;i<pages.length;i++){
      const c=render(pages[i],L.side), data=c.toDataURL('image/jpeg',L.q);
      const land=c.width>c.height, pw=land?297:210, ph=pw*c.height/c.width;
      const fmt=[Math.min(pw,ph),Math.max(pw,ph)], ori=land?'l':'p';
      if(!pdf) pdf=new jsPDF({unit:'mm',format:fmt,orientation:ori,compress:true}); else pdf.addPage(fmt,ori);
      pdf.addImage(data,'JPEG',0,0,pw,ph,undefined,'FAST');
    }
    const name=($('pdfName').value.trim()||'twarvis_doc').replace(/[\\/:*?"<>|]/g,'_');
    const blob=pdf.output('blob'); pdf.save(name+'.pdf');
    const kb=blob.size/1024; toast(`${name}.pdf saved (${kb>1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB'})`);
    pages=[]; cur=0; updateBadge(); setTimeout(startCamera,900);
  }catch(e){ console.error(e); toast('Could not create the PDF'); }
  btn.disabled=false; btn.textContent='Create PDF';
};

startCamera();
</script>
</body>
