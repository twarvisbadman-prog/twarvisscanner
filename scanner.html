<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Scanner (Photo Mode)</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    #status { margin: 10px; color: #ffd700; font-size: 14px; }
    .controls { display: flex; gap: 20px; margin-top: 20px; }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ffd700;
      color: black;
    }
    #result { display: none; margin-top: 20px; width: 100%; max-width: 500px; }
    #result img { width: 100%; border-radius: 12px; border: 2px solid #ffd700; }
    .download-btn { background: #00ff41; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="status">📷 Ready to scan...</div>

  <div class="controls">
    <button id="captureBtn">📸 Scan Page</button>
    <button id="resetBtn">🔄 Reset</button>
  </div>

  <div id="result">
    <img id="previewImage" />
    <button class="download-btn" id="downloadBtn">💾 Download PNG</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const captureBtn = document.getElementById('captureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultDiv = document.getElementById('result');
    const previewImage = document.getElementById('previewImage');
    const downloadBtn = document.getElementById('downloadBtn');

    let capturedImageData = null;

    async function capturePhoto() {
      try {
        statusDiv.textContent = '⏳ Opening camera...';

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });

        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        await new Promise(resolve => video.onloadedmetadata = resolve);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        stream.getTracks().forEach(track => track.stop());

        capturedImageData = canvas.toDataURL('image/png');
        previewImage.src = capturedImageData;
        resultDiv.style.display = 'block';

        statusDiv.textContent = '✅ Page scanned!';
        statusDiv.style.color = '#00ff41';
      } catch (err) {
        statusDiv.textContent = '❌ ERROR: ' + err.message;
        statusDiv.style.color = '#ff4444';
      }
    }

    function downloadImage() {
      if (!capturedImageData) return;
      const link = document.createElement('a');
      link.download = 'scan_' + Date.now() + '.png';
      link.href = capturedImageData;
      link.click();
      statusDiv.textContent = '💾 Downloaded!';
    }

    function resetScanner() {
      resultDiv.style.display = 'none';
      capturedImageData = null;
      statusDiv.textContent = '📷 Ready to scan again.';
      statusDiv.style.color = '#ffd700';
    }

    captureBtn.addEventListener('click', capturePhoto);
    downloadBtn.addEventListener('click', downloadImage);
    resetBtn.addEventListener('click', resetScanner);
  </script>

</body>
</html>
