<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Student Hub - Scanner</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0a0a0a;
        }
        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.03) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }
        .glass-overlay {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
            padding: 10px 0;
            flex-shrink: 0;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .logo i { color: #ffd700; }
        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .nav-links a {
            color: rgba(255, 215, 0, 0.3);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }
        .page-counter {
            color: rgba(255, 215, 0, 0.4);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 14px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.03);
        }
        .scanner-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .camera-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            min-height: 0;
        }
        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-frame {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .frame-corners {
            position: relative;
            width: 75%;
            max-width: 500px;
            aspect-ratio: 3/4;
        }
        .corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: rgba(255, 215, 0, 0.5);
            border-style: solid;
            border-width: 0;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .corner.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-radius: 4px 0 0 0; }
        .corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 4px 0 0; }
        .corner.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 4px; }
        .corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 4px 0; }
        .frame-label {
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.3);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .scan-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .scan-loading .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 215, 0, 0.05);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .scan-loading p {
            margin-top: 16px;
            color: rgba(255, 215, 0, 0.3);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .scanner-controls {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            padding: 16px 20px 24px;
            flex-shrink: 0;
        }
        .controls-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 215, 0, 0.3);
            font-size: 22px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: 0.3s;
        }
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.05);
            color: #ffd700;
        }
        .ctrl-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .capture-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .capture-btn:active { transform: scale(0.9); }
        .capture-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .capture-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .capture-dot {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            transition: 0.3s;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.3);
        }
        .capture-btn:hover .capture-ring {
            border-color: rgba(255, 215, 0, 0.4);
        }
        .result-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 92vh;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            overflow: hidden;
        }
        .result-panel.open { transform: translateY(0); }
        .result-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 2px;
            margin: 12px auto 0;
        }
        .step-options {
            padding: 20px 24px 24px;
        }
        .step-options .preview-mini {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.04);
            margin-bottom: 16px;
            position: relative;
        }
        .step-options .preview-mini img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 35vh;
            object-fit: contain;
        }
        .crop-preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            cursor: crosshair;
        }
        .crop-preview-overlay.active { display: block; }
        .crop-box-preview {
            position: absolute;
            border: 2px solid #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            display: none;
            cursor: move;
        }
        .crop-box-preview .crop-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ffd700;
            border: 2px solid #0a0a0a;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .crop-handle.nw { top: -8px; left: -8px; cursor: nw-resize; }
        .crop-handle.ne { top: -8px; right: -8px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -8px; left: -8px; cursor: sw-resize; }
        .crop-handle.se { bottom: -8px; right: -8px; cursor: se-resize; }
        .step-options .page-info {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 215, 0, 0.3);
            margin-bottom: 12px;
        }
        .step-options .page-info span {
            color: #ffd700;
            font-weight: 700;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-option {
            padding: 14px 12px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            min-height: 76px;
            justify-content: center;
        }
        .btn-option .icon-big { font-size: 1.6rem; }
        .btn-option .sub-text {
            font-size: 0.6rem;
            font-weight: 500;
            opacity: 0.6;
        }
        .btn-continue {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.2);
        }
        .btn-continue:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(255, 215, 0, 0.35);
        }
        .btn-done {
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #fff;
            box-shadow: 0 4px 30px rgba(255, 26, 26, 0.2);
        }
        .btn-done:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(255, 26, 26, 0.35);
        }
        .btn-rescan {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            box-shadow: 0 4px 30px rgba(0, 180, 216, 0.15);
        }
        .btn-rescan:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(0, 180, 216, 0.25);
        }
        .btn-crop {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 2px solid rgba(0, 255, 65, 0.15);
        }
        .btn-crop:hover {
            background: rgba(0, 255, 65, 0.05);
            border-color: rgba(0, 255, 65, 0.3);
            transform: translateY(-3px);
        }
        .btn-crop.active-mode {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.05);
        }
        .btn-option:active { transform: scale(0.97); }
        .options-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 12px;
        }
        .options-nav button {
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.05);
            color: rgba(255, 215, 0, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .options-nav button:hover {
            background: rgba(255, 215, 0, 0.05);
            color: #ffd700;
        }
        .options-nav .page-count {
            color: rgba(255, 215, 0, 0.2);
            font-size: 13px;
            display: flex;
            align-items: center;
        }
        .crop-controls {
            display: none;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 215, 0, 0.04);
        }
        .crop-controls.active { display: flex; }
        .crop-controls .btn-crop-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-apply-crop {
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #0a0a0a;
        }
        .btn-apply-crop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 65, 0.3);
        }
        .btn-cancel-crop {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-cancel-crop:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .step-edit {
            display: none;
            padding: 16px 24px 24px;
        }
        .step-edit.active {
            display: block;
            animation: fadeSlideUp 0.4s ease;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .step-edit .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .step-edit .edit-header h3 {
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .step-edit .edit-header .close-edit {
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .step-edit .edit-header .close-edit:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .step-edit .preview-container {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.04);
            margin-bottom: 16px;
        }
        .step-edit .preview-container img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 30vh;
            object-fit: contain;
        }
        .edit-toolbar {
            display: flex;
            gap: 6px;
            padding: 8px 0 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 215, 0, 0.04);
            margin-bottom: 12px;
        }
        .edit-toolbar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            background: rgba(255, 215, 0, 0.02);
            color: rgba(255, 215, 0, 0.4);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .edit-toolbar button:hover {
            background: rgba(255, 215, 0, 0.05);
            color: #ffd700;
        }
        .edit-toolbar button.active {
            background: rgba(255, 215, 0, 0.12);
            border-color: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .edit-toolbar button.danger:hover {
            border-color: rgba(255,0,0,0.2);
            color: #ff4444;
        }
        .edit-toolbar .btn-save-changes {
            background: rgba(0, 255, 65, 0.08);
            border-color: rgba(0, 255, 65, 0.15);
            color: #00ff41;
        }
        .edit-toolbar .btn-save-changes:hover {
            background: rgba(0, 255, 65, 0.15);
            border-color: rgba(0, 255, 65, 0.3);
            color: #00ff41;
        }
        .edit-sliders {
            display: none; /* HIDDEN - REMOVED BAD BRIGHTNESS/CONTRAST */
        }
        .pdf-naming {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .pdf-naming label {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }
        .pdf-naming input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 10px;
            color: #ffd700;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            transition: 0.3s;
            outline: none;
            min-width: 0;
        }
        .pdf-naming input:focus {
            border-color: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.03);
        }
        .pdf-naming .ext {
            color: rgba(255, 215, 0, 0.15);
            font-weight: 600;
            font-size: 14px;
        }
        .btn-create-pdf {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #00ff41, #00cc33);
            color: #0a0a0a;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 255, 65, 0.15);
        }
        .btn-create-pdf:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 50px rgba(0, 255, 65, 0.25);
        }
        .btn-create-pdf:active { transform: scale(0.98); }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 14px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 300;
            display: none;
            border: 1px solid rgba(255, 215, 0, 0.06);
            max-width: 90%;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .toast.error { border-color: rgba(255,0,0,0.2); }
        .toast.success { border-color: rgba(0, 255, 65, 0.2); }
        @media (max-width: 640px) {
            .options-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .btn-option { padding: 12px 8px; font-size: 0.8rem; min-height: 66px; }
            .btn-option .icon-big { font-size: 1.3rem; }
            .btn-option .sub-text { display: none; }
            .header-content { padding: 0 12px; flex-wrap: wrap; gap: 4px; }
            .logo { font-size: 1rem; }
            .nav-links a { font-size: 0.75rem; padding: 4px 8px; }
            .page-counter { font-size: 0.7rem; padding: 2px 10px; }
            .capture-ring { width: 60px; height: 60px; }
            .capture-dot { width: 46px; height: 46px; }
            .frame-corners { width: 85%; }
            .corner { width: 20px; height: 20px; }
            .step-options { padding: 16px; }
            .step-edit { padding: 12px 16px 16px; }
            .pdf-naming { flex-wrap: wrap; }
            .crop-controls { flex-direction: column; }
            .edit-toolbar button { font-size: 10px; padding: 6px 12px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .header { padding: 4px 0; }
            .scanner-controls { padding: 8px 16px 12px; }
            .capture-ring { width: 48px; height: 48px; }
            .capture-dot { width: 36px; height: 36px; }
            .frame-corners { width: 60%; }
        }
    </style>
</head>
<body>
    <canvas id="rain-canvas"></canvas>
    <div class="glow-overlay"></div>
    
    <div class="glass-overlay">
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    STUDENT HUB
                </div>
                <div class="nav-links">
                    <a href="index.html"><i class="fas fa-home"></i> Home</a>
                    <a href="scanner.html" class="active"><i class="fas fa-camera"></i> Scanner</a>
                    <a href="about.html"><i class="fas fa-info-circle"></i> About</a>
                </div>
                <span class="page-counter" id="pageCounter"><i class="fas fa-file"></i> 0 pages</span>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <div class="scanner-area">
            <div class="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <div class="scan-frame" id="scanFrame">
                    <div class="frame-corners">
                        <span class="corner tl"></span>
                        <span class="corner tr"></span>
                        <span class="corner bl"></span>
                        <span class="corner br"></span>
                    </div>
                    <span class="frame-label">✦ POSITION DOCUMENT ✦</span>
                </div>
                <div class="scan-loading" id="scanLoading">
                    <div class="spinner"></div>
                    <p>✦ PROCESSING ✦</p>
                </div>
            </div>

            <div class="scanner-controls">
                <div class="controls-row">
                    <button class="ctrl-btn" id="flashBtn" disabled>
                        <i class="fas fa-bolt"></i>
                    </button>
                    <button class="capture-btn" id="captureBtn" disabled>
                        <div class="capture-ring">
                            <div class="capture-dot"></div>
                        </div>
                    </button>
                    <button class="ctrl-btn" id="galleryBtn">
                        <i class="fas fa-images"></i>
                    </button>

    <script src="https://cdn.jsdelivr.net/npm/jscanify@1.2.0/dist/jscanify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // ============================================
        // MATRIX GOLDEN RAIN
        // ============================================
        (function() {
            const canvas = document.getElementById('rain-canvas');
            const ctx = canvas.getContext('2d');
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            class GoldenDrop {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.speed = Math.random() * 4 + 2;
                    this.size = Math.random() * 14 + 10;
                    this.opacity = Math.random() * 0.3 + 0.1;
                    this.char = chars[Math.floor(Math.random() * chars.length)];
                }
                fall() {
                    this.y += this.speed;
                    if (this.y > canvas.height + 20) { this.reset(); this.y = -20; }
                }
                draw() {
                    ctx.font = `${this.size}px monospace`;
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                    ctx.shadowColor = `rgba(255, 215, 0, ${this.opacity * 0.3})`;
                    ctx.shadowBlur = 10;
                    ctx.fillText(this.char, this.x, this.y);
                    ctx.shadowBlur = 0;
                }
            }
            const drops = Array.from({ length: 150 }, () => new GoldenDrop());
            function drawRain() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drops.forEach(d => { d.draw(); d.fall(); });
                requestAnimationFrame(drawRain);
            }
            drawRain();
        })();

        // ============================================
        // STUDENT HUB SCANNER
        // ============================================
        class StudentHubScanner {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.optionsPreview = document.getElementById('optionsPreview');
                this.editPreview = document.getElementById('editPreview');
                this.resultPanel = document.getElementById('resultPanel');
                this.stepOptions = document.getElementById('stepOptions');
                this.stepEdit = document.getElementById('stepEdit');
                this.toast = document.getElementById('toast');
                this.scanLoading = document.getElementById('scanLoading');
                this.pageCounter = document.getElementById('pageCounter');
                this.scanFrame = document.getElementById('scanFrame');
                this.cropOverlay = document.getElementById('cropOverlay');
                this.cropBox = document.getElementById('cropBox');
                this.cropControls = document.getElementById('cropControls');
                this.previewWrapper = document.getElementById('previewWrapper');

                this.stream = null;
                this.pages = [];
                this.currentIndex = 0;
                this.filter = 'original';
                this.isProcessing = false;
                this.isEditMode = false;
                this.isCropMode = false;
                this.cropData = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
                this.isDragging = false;
                this.dragHandle = null;
                this.dragStart = { x: 0, y: 0 };
                this.dragStartData = { x: 0, y: 0, w: 0, h: 0 };

                this.bindEvents();
                this.checkGalleryMode();
                setTimeout(() => this.startCamera(), 500);
                console.log('📸 Student Hub Scanner ready');
            }

            bindEvents() {
                document.getElementById('captureBtn').addEventListener('click', () => this.capture());
                document.getElementById('flashBtn').addEventListener('click', () => this.toggleFlash());
                document.getElementById('galleryBtn').addEventListener('click', () => this.openGallery());
                document.getElementById('continueBtn').addEventListener('click', () => this.continueScanning());
                document.getElementById('doneBtn').addEventListener('click', () => this.goToEditMode());
                document.getElementById('rescanBtn').addEventListener('click', () => this.rescanPage());
                document.getElementById('cropBtn').addEventListener('click', () => this.toggleCropMode());
                document.getElementById('applyCropBtn').addEventListener('click', () => this.applyCrop());
                document.getElementById('cancelCropBtn').addEventListener('click', () => this.cancelCrop());
                document.getElementById('optionsPrev').addEventListener('click', () => this.optionsPrev());
                document.getElementById('optionsNext').addEventListener('click', () => this.optionsNext());
                document.getElementById('backToOptions').addEventListener('click', () => this.backToOptions());

                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.filter = btn.dataset.filter;
                        this.applyFilter();
                    });
                });

                document.getElementById('rotateEditBtn').addEventListener('click', () => this.rotatePage());
                document.getElementById('deleteEditBtn').addEventListener('click', () => this.deletePage());
                document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEditChanges());
                document.getElementById('createPdfBtn').addEventListener('click', () => this.makePDF());

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !this.isProcessing) this.capture();
                    if (e.key === 'Escape') {
                        if (this.isCropMode) { this.cancelCrop(); }
                        else { this.closeResult(); }
                    }
                });

                this.initCropDrag();
            }

            // ============================================
            // GALLERY MODE - FIXED
            // ============================================
            checkGalleryMode() {
                const urlParams = new URLSearchParams(window.location.search);
                const mode = urlParams.get('mode');
                
                if (mode === 'gallery') {
                    const storedImages = sessionStorage.getItem('galleryImages');
                    
                    if (storedImages) {
                        const images = JSON.parse(storedImages);
                        sessionStorage.removeItem('galleryImages');
                        
                        if (images && images.length > 0) {
                            let loaded = 0;
                            images.forEach(dataUrl => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    canvas.width = img.width;
                                    canvas.height = img.height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0);
                                    this.addPage(canvas);
                                    loaded++;
                                    if (loaded === images.length) {
                                        this.showToast(`📸 Added ${images.length} images from gallery`);
                                        setTimeout(() => { this.goToEditMode(); }, 500);
                                    }
                                };
                                img.src = dataUrl;
                            });
                        }
                    } else {
                        setTimeout(() => { this.openGallery(); }, 500);
                    }
                }
            }

            // ============================================
            // CAMERA
            // ============================================
            async startCamera() {
                try {
                    this.showToast('✦ Starting camera...');
                    const constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    };
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;
                    await this.video.play();
                    document.getElementById('captureBtn').disabled = false;
                    document.getElementById('flashBtn').disabled = false;
                    this.showToast('✦ Camera ready');
                    this.hideToastAfter(1500);
                } catch (err) {
                    console.error('Camera error:', err);
                    this.showToast('❌ Camera access denied', 'error');
                }
            }

            // ============================================
            // CAPTURE
            // ============================================
            capture() {
                if (this.isProcessing) return;
                this.isProcessing = true;
                this.scanLoading.style.display = 'flex';

                try {
                    const w = this.video.videoWidth || 1280;
                    const h = this.video.videoHeight || 720;

                    this.canvas.width = w;
                    this.canvas.height = h;
                    this.ctx.drawImage(this.video, 0, 0, w, h);

                    let cropped = null;
                    try {
                        if (typeof Jscanify !== 'undefined') {
                            const jscanify = new Jscanify();
                            cropped = jscanify.extractPaper(this.canvas, 5);
                        }
                    } catch (err) {
                        console.warn('Auto-crop failed:', err);
                    }

                    if (!cropped || cropped.width === 0) {
                        const size = Math.min(w, h) * 0.78;
                        const x = (w - size) / 2;
                        const y = (h - size * 1.3) / 2;
                        const temp = document.createElement('canvas');
                        temp.width = size;
                        temp.height = size * 1.3;
                        const tCtx = temp.getContext('2d');
                        tCtx.drawImage(this.canvas, x, y, size, size * 1.3, 0, 0, size, size * 1.3);
                        cropped = temp;
                    }

                    this.addPage(cropped);
                    this.scanLoading.style.display = 'none';
                    this.isProcessing = false;
                    this.showToast('✅ Page scanned!');

                } catch (err) {
                    console.error('Capture error:', err);
                    this.scanLoading.style.display = 'none';
                    this.isProcessing = false;
                    this.showToast('❌ Scan failed', 'error');
                }
            }

            // ============================================
            // PAGE MANAGEMENT
            // ============================================
            addPage(canvas) {
                const dataUrl = canvas.toDataURL('image/png');
                this.pages.push(dataUrl);
                this.currentIndex = this.pages.length - 1;
                this.updateOptionsView();
                this.updateCounter();
                this.showResult();
                this.scanFrame.style.display = 'none';
                this.exitCropMode();
            }

            updateOptionsView() {
                if (this.pages.length > 0) {
                    this.optionsPreview.src = this.pages[this.currentIndex];
                    document.getElementById('optionsPageNum').textContent = this.currentIndex + 1;
                    document.getElementById('optionsTotalPages').textContent = this.pages.length;
                    document.getElementById('optionsCount').textContent = `${this.currentIndex + 1} / ${this.pages.length}`;
                }
            }

            updateEditView() {
                if (this.pages.length > 0) {
                    this.editPreview.src = this.pages[this.currentIndex];
                }
            }

            updateCounter() {
                this.pageCounter.innerHTML = `<i class="fas fa-file"></i> ${this.pages.length} pages`;
            }

            showResult() {
                this.resultPanel.classList.add('open');
                this.stepOptions.style.display = 'block';
                this.stepEdit.classList.remove('active');
                this.stepEdit.style.display = 'none';
                this.isEditMode = false;
                this.exitCropMode();
                this.updateOptionsView();
            }

            closeResult() {
                this.resultPanel.classList.remove('open');
                this.scanFrame.style.display = 'flex';
                this.exitCropMode();
            }

            optionsPrev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.updateOptionsView();
                    this.exitCropMode();
                }
            }

            optionsNext() {
                if (this.currentIndex < this.pages.length - 1) {
                    this.currentIndex++;
                    this.updateOptionsView();
                    this.exitCropMode();
                }
            }

            // ============================================
            // FOUR OPTIONS
            // ============================================
            continueScanning() {
                this.closeResult();
                this.scanFrame.style.display = 'flex';
                this.showToast('📸 Scan next page');
            }

            rescanPage() {
                if (this.pages.length === 0) return;
                this.pages.splice(this.currentIndex, 1);
                if (this.pages.length === 0) {
                    this.closeResult();
                    this.updateCounter();
                    this.scanFrame.style.display = 'flex';
                    this.showToast('🔄 Page removed. Scan again.');
                    return;
                }
                this.currentIndex = Math.min(this.currentIndex, this.pages.length - 1);
                this.updateOptionsView();
                this.updateCounter();
                this.showToast('🔄 Page removed. Scan again.');
                setTimeout(() => {
                    this.closeResult();
                    this.scanFrame.style.display = 'flex';
                }, 500);
            }

            goToEditMode() {
                if (this.pages.length === 0) {
                    this.showToast('❌ No pages to edit', 'error');
                    return;
                }
                this.isEditMode = true;
                this.stepOptions.style.display = 'none';
                this.stepEdit.style.display = 'block';
                setTimeout(() => { this.stepEdit.classList.add('active'); }, 50);
                this.updateEditView();
                this.showToast('✏️ Edit your document');
                this.exitCropMode();
            }

            backToOptions() {
                this.isEditMode = false;
                this.stepEdit.classList.remove('active');
                this.stepEdit.style.display = 'none';
                this.stepOptions.style.display = 'block';
                this.updateOptionsView();
                this.exitCropMode();
                this.showToast('📄 Back to pages');
            }

            saveEditChanges() {
                this.showToast('✅ Changes saved!');
            }

            // ============================================
            // CROP MODE
            // ============================================
            toggleCropMode() {
                if (this.isCropMode) { this.exitCropMode(); }
                else { this.enterCropMode(); }
            }

            enterCropMode() {
                if (this.pages.length === 0) {
                    this.showToast('❌ No page to crop', 'error');
                    return;
                }
                this.isCropMode = true;
                this.cropOverlay.classList.add('active');
                this.cropControls.classList.add('active');
                document.getElementById('cropBtn').classList.add('active-mode');
                this.cropData = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
                this.updateCropBox();
                this.showToast('✂️ Drag the golden handles to crop');
            }

            exitCropMode() {
                this.isCropMode = false;
                this.cropOverlay.classList.remove('active');
                this.cropControls.classList.remove('active');
                document.getElementById('cropBtn').classList.remove('active-mode');
                this.cropBox.style.display = 'none';
            }

            updateCropBox() {
                const wrapper = this.previewWrapper;
                if (!wrapper) return;
                const rect = wrapper.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                if (w === 0 || h === 0) return;
                const box = this.cropBox;
                box.style.display = 'block';
                box.style.left = (this.cropData.x * w) + 'px';
                box.style.top = (this.cropData.y * h) + 'px';
                box.style.width = (this.cropData.w * w) + 'px';
                box.style.height = (this.cropData.h * h) + 'px';
            }

            initCropDrag() {
                const box = this.cropBox;
                const handles = box.querySelectorAll('.crop-handle');

                handles.forEach(h => {
                    h.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.isDragging = true;
                        this.dragHandle = h.dataset.handle;
                        this.dragStart.x = e.clientX;
                        this.dragStart.y = e.clientY;
                        this.dragStartData = { ...this.cropData };
                    });

                    h.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        this.isDragging = true;
                        this.dragHandle = h.dataset.handle;
                        this.dragStart.x = touch.clientX;
                        this.dragStart.y = touch.clientY;
                        this.dragStartData = { ...this.cropData };
                    });
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging || !this.isCropMode) return;
                    this.resizeCrop(e.clientX, e.clientY);
                });

                document.addEventListener('touchmove', (e) => {
                    if (!this.isDragging || !this.isCropMode) return;
                    const touch = e.touches[0];
                    this.resizeCrop(touch.clientX, touch.clientY);
                }, { passive: true });

                document.addEventListener('mouseup', () => { this.isDragging = false; });
                document.addEventListener('touchend', () => { this.isDragging = false; });
            }

            resizeCrop(clientX, clientY) {
                const wrapper = this.previewWrapper;
                const rect = wrapper.getBoundingClientRect();
                const dx = (clientX - this.dragStart.x) / rect.width;
                const dy = (clientY - this.dragStart.y) / rect.height;

                let x = this.dragStartData.x;
                let y = this.dragStartData.y;
                let w = this.dragStartData.w;
                let h = this.dragStartData.h;
                const minSize = 0.05;

                switch (this.dragHandle) {
                    case 'se':
                        w = Math.max(minSize, this.dragStartData.w + dx);
                        h = Math.max(minSize, this.dragStartData.h + dy);
                        break;
                    case 'nw':
                        x = Math.max(0, this.dragStartData.x + dx);
                        y = Math.max(0, this.dragStartData.y + dy);
                        w = Math.max(minSize, this.dragStartData.w - dx);
                        h = Math.max(minSize, this.dragStartData.h - dy);
                        break;
                    case 'ne':
                        y = Math.max(0, this.dragStartData.y + dy);
                        w = Math.max(minSize, this.dragStartData.w + dx);
                        h = Math.max(minSize, this.dragStartData.h - dy);
                        break;
                    case 'sw':
                        x = Math.max(0, this.dragStartData.x + dx);
                        w = Math.max(minSize, this.dragStartData.w - dx);
                        h = Math.max(minSize, this.dragStartData.h + dy);
                        break;
                    default: return;
                }

                x = Math.max(0, Math.min(x, 1 - minSize));
                y = Math.max(0, Math.min(y, 1 - minSize));
                w = Math.min(1 - x, Math.max(minSize, w));
                h = Math.min(1 - y, Math.max(minSize, h));

                this.cropData = { x, y, w, h };
                this.updateCropBox();
            }

            applyCrop() {
                if (!this.isCropMode || this.pages.length === 0) return;
                const dataUrl = this.pages[this.currentIndex];
                const img = new Image();
                img.onload = () => {
                    const cropX = this.cropData.x * img.width;
                    const cropY = this.cropData.y * img.height;
                    const cropW = this.cropData.w * img.width;
                    const cropH = this.cropData.h * img.height;

                    const canvas = document.createElement('canvas');
                    canvas.width = cropW;
                    canvas.height = cropH;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                    this.pages[this.currentIndex] = canvas.toDataURL('image/png');
                    this.updateOptionsView();
                    this.updateEditView();
                    this.showToast('✅ Crop applied successfully!');
                    this.exitCropMode();
                };
                img.src = dataUrl;
            }

            cancelCrop() {
                this.exitCropMode();
                this.showToast('✂️ Crop cancelled');
            }

            // ============================================
            // FILTERS
            // ============================================
            applyFilter() {
                if (this.pages.length === 0) return;
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const filtered = this.applyFilterToCanvas(canvas);
                    this.pages[this.currentIndex] = filtered.toDataURL('image/png');
                    this.editPreview.src = this.pages[this.currentIndex];
                };
                img.src = this.pages[this.currentIndex];
            }

            applyFilterToCanvas(canvas) {
                const result = document.createElement('canvas');
                result.width = canvas.width;
                result.height = canvas.height;
                const ctx = result.getContext('2d');
                ctx.drawImage(canvas, 0, 0);

                try {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i], g = data[i + 1], b = data[i + 2];

                        switch (this.filter) {
                            case 'grayscale':
                                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                                r = g = b = gray;
                                break;
                            case 'enhance':
                                r = Math.min(255, r * 1.1 + 5);
                                g = Math.min(255, g * 1.1 + 5);
                                b = Math.min(255, b * 1.1 + 5);
                                break;
                            case 'vintage':
                                r = Math.min(255, r * 1.1 + 10);
                                g = Math.min(255, g * 0.9 + 5);
                                b = Math.min(255, b * 0.8 + 5);
                                break;
                            default: break;
                        }

                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;
                    }
                    ctx.putImageData(imageData, 0, 0);
                } catch (err) { console.warn('Filter failed:', err); }
                return result;
            }

            // ============================================
            // ROTATE
            // ============================================
            rotatePage() {
                if (this.pages.length === 0) return;
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.height;
                    canvas.height = img.width;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    this.pages[this.currentIndex] = canvas.toDataURL('image/png');
                    this.editPreview.src = this.pages[this.currentIndex];
                    this.showToast('🔄 Rotated 90°');
                };
                img.src = this.pages[this.currentIndex];
            }

            // ============================================
            // DELETE
            // ============================================
            deletePage() {
                if (this.pages.length === 0) return;
                this.pages.splice(this.currentIndex, 1);
                if (this.pages.length === 0) {
                    this.showToast('No pages left');
                    this.backToOptions();
                    this.closeResult();
                    this.updateCounter();
                    this.scanFrame.style.display = 'flex';
                    return;
                }
                this.currentIndex = Math.min(this.currentIndex, this.pages.length - 1);
                this.updateEditView();
                this.updateOptionsView();
                this.updateCounter();
                this.showToast('🗑️ Page deleted');
            }

            // ============================================
            // MAKE PDF
            // ============================================
            makePDF() {
                if (this.pages.length === 0) {
                    this.showToast('❌ No pages', 'error');
                    return;
                }

                if (typeof window.jspdf === 'undefined') {
                    this.showToast('❌ PDF library not loaded', 'error');
                    return;
                }

                this.showToast('📄 Creating PDF...');
                const { jsPDF } = window.jspdf;
                const name = document.getElementById('pdfName').value.trim() || 'twarvis';
                const pdf = new jsPDF();

                this.pages.forEach((dataUrl, i) => {
                    if (i > 0) pdf.addPage();
                    pdf.addImage(dataUrl, 'PNG', 0, 0, pdf.internal.pageSize.width, pdf.internal.pageSize.height);
                });

                pdf.save(`${name}.pdf`);
                this.showToast(`✅ ${name}.pdf saved!`);

                this.pages = [];
                this.currentIndex = 0;
                this.updateCounter();
                this.closeResult();
                this.scanFrame.style.display = 'flex';
                this.stepOptions.style.display = 'block';
                this.stepEdit.classList.remove('active');
                this.stepEdit.style.display = 'none';
                this.isEditMode = false;
                this.exitCropMode();
            }

            // ============================================
            // GALLERY
            // ============================================
            openGallery() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.multiple = true;
                input.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    
                    let loaded = 0;
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                this.addPage(canvas);
                                loaded++;
                                if (loaded === files.length) {
                                    this.showToast(`📸 Added ${files.length} images from gallery`);
                                    setTimeout(() => { this.goToEditMode(); }, 500);
                                }
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                };
                input.click();
            }

            // ============================================
            // FLASH
            // ============================================
            toggleFlash() {
                if (!this.stream) return;
                const track = this.stream.getVideoTracks()[0];
                if (!track) return;
                try {
                    const settings = track.getSettings();
                    track.applyConstraints({ advanced: [{ torch: !settings.torch }] })
                        .then(() => this.showToast(settings.torch ? '💡 Flash off' : '💡 Flash on'));
                } catch (err) {
                    this.showToast('💡 Flash not supported', 'error');
                }
            }

            // ============================================
            // TOAST
            // ============================================
            showToast(msg, type = 'info') {
                const toast = this.toast;
                toast.textContent = msg;
                toast.style.display = 'block';
                toast.className = 'toast';
                if (type === 'error') toast.classList.add('error');
                if (type === 'success') toast.classList.add('success');
                clearTimeout(toast._timeout);
                this.hideToastAfter(3000);
            }

            hideToastAfter(ms = 3000) {
                clearTimeout(this.toast._timeout);
                this.toast._timeout = setTimeout(() => {
                    this.toast.style.display = 'none';
                }, ms);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new StudentHubScanner();
        });
    </script>
</body>
</html>
